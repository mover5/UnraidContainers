name: Sync Unraid templates

on:
  push:
    branches: [main]
    paths:
      - "containers/*/unraid-template.xml"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync templates to templates/ directory
        run: |
          mkdir -p templates
          rm -f templates/*.xml

          for template in containers/*/unraid-template.xml; do
            container_name=$(basename "$(dirname "$template")")
            cp "$template" "templates/${container_name}.xml"
            echo "Synced ${container_name}.xml"
          done

      - name: Check for changes
        id: changes
        run: |
          git add templates/
          git diff --cached --quiet templates/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/
          git commit -m "Sync Unraid templates"
          git push
