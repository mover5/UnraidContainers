# ── Sensible defaults for dev work ────────────────────────────────────

# 256-color and true-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support (scroll, click panes, resize)
set -g mouse on

# Large scrollback buffer
set -g history-limit 50000

# Start window/pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster escape time (important for vim/editor usage)
set -sg escape-time 10

# Status bar
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour39,bold] #S #[default]│ "
set -g status-left-length 20
set -g status-right " %H:%M "
setw -g window-status-current-style "fg=colour39,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Easy split pane shortcuts (use current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window uses current path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file /etc/tmux.conf \; display "Config reloaded"
