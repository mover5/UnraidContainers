<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Backup Manager{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2/css/pico.min.css" crossorigin>
    <link rel="stylesheet" href="{{ url_for('main.static', filename='style.css') }}">
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Backup Manager</strong></li>
        </ul>
        <ul>
            <li><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('main.add_source', source_type='mysql') }}" role="button" class="outline">+ MySQL</a></li>
            <li><a href="{{ url_for('main.add_source', source_type='azure') }}" role="button" class="outline">+ Azure</a></li>
        </ul>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <small>Unraid Database Backup</small>
    </footer>
</body>
</html>
